name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.compiler }} / ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # Warnings are errors on Clang (the compiler used during development);
          # GCC builds with the same warnings enabled but non-fatal.
          - { compiler: clang, preset: ci, cc: clang-18, cxx: clang++-18, pkg: clang-18 }
          - { compiler: clang, preset: asan, cc: clang-18, cxx: clang++-18, pkg: clang-18 }
          - { compiler: gcc, preset: release, cc: gcc-14, cxx: g++-14, pkg: g++-14 }
          - { compiler: gcc, preset: asan, cc: gcc-14, cxx: g++-14, pkg: g++-14 }
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build ${{ matrix.pkg }}
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}
      - name: Theory report
        if: matrix.preset != 'asan'
        run: ./build/${{ matrix.preset }}/apps/bsar_eval theory | tee theory-${{ matrix.compiler }}.md
      - uses: actions/upload-artifact@v4
        if: matrix.preset != 'asan'
        with:
          name: theory-${{ matrix.compiler }}
          path: theory-${{ matrix.compiler }}.md

  gdal:
    name: gcc / GDAL
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgdal-dev
      - run: cmake --preset gdal
      - run: cmake --build --preset gdal
      - run: ctest --preset gdal

  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: pip install clang-format==19.1.7
      - name: clang-format
        run: |
          git ls-files '*.hpp' '*.cpp' | xargs clang-format --dry-run --Werror

  tidy:
    runs-on: ubuntu-24.04
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang-tidy-18
      - run: cmake --preset release -DBSAR_BUILD_TESTS=OFF -DBSAR_BUILD_BENCH=OFF
      - name: clang-tidy
        run: |
          git ls-files 'src/*.cpp' 'apps/*.cpp' | \
            xargs -P 4 -n 4 clang-tidy-18 -p build/release --quiet

  python:
    name: python / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build and install the module
        run: pip install -v ".[test]"
      - name: Test
        run: pytest -v python/tests

  bench:
    name: bench / Embree baseline
    runs-on: ubuntu-24.04
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang-18 libembree-dev
      - name: Configure
        run: cmake --preset native -DBSAR_WITH_EMBREE=ON -DBSAR_BUILD_TESTS=OFF
      - name: Build
        run: cmake --build --preset native
      - name: Benchmark
        run: python3 scripts/run_benchmarks.py --build build/native --out benchmarks-ci.md
      - uses: actions/upload-artifact@v4
        with:
          name: benchmarks-ci
          path: benchmarks-ci.md
